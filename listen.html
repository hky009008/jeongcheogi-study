RANT OPTION·CASCADE·ROLE·시스템 카탈로그", "slug": "2026-11-03-D032"}, {"f": "D033.mp3", "id": "D033", "part": "", "t": "DML: SELECT 기본 구조·WHERE 연산자·실행 순서·INSERT/UPDATE/DELETE", "slug": "2026-11-04-D033"}, {"f": "D036-1.mp3", "id": "D036", "part": "1", "t": "서브쿼리(단일·다중 행·EXISTS·상관)와 집합 연산자 + 참조 동작·데이터 타입 보충", "slug": "2026-11-09-D036"}, {"f": "D036-2.mp3", "id": "D036", "part": "2", "t": "서브쿼리(단일·다중 행·EXISTS·상관)와 집합 연산자 + 참조 동작·데이터 타입 보충", "slug": "2026-11-09-D036"}, {"f": "D037-1.mp3", "id": "D037", "part": "1", "t": "뷰(View)와 인덱스 — 가상 테이블, B-트리, 클러스터드·넌클러스터드", "slug": "2026-11-11-D037"}, {"f": "D037-2.mp3", "id": "D037", "part": "2", "t": "뷰(View)와 인덱스 — 가상 테이블, B-트리, 클러스터드·넌클러스터드", "slug": "2026-11-11-D037"}, {"f": "D038-1.mp3", "id": "D038", "part": "1", "t": "절차형 SQL — 프로시저·함수·트리거, 블록·제어문·커서·예외 처리", "slug": "2026-11-12-D038"}, {"f": "D038-2.mp3", "id": "D038", "part": "2", "t": "절차형 SQL — 프로시저·함수·트리거, 블록·제어문·커서·예외 처리", "slug": "2026-11-12-D038"}, {"f": "D039-1.mp3", "id": "D039", "part": "1", "t": "1과목 빠진 개념 보충 — UML 관계·방법론·HIPO·응집도·McCabe·커버리지·패키징·REST", "slug": "2026-11-13-D039"}, {"f": "D039-2.mp3", "id": "D039", "part": "2", "t": "1과목 빠진 개념 보충 — UML 관계·방법론·HIPO·응집도·McCabe·커버리지·패키징·REST", "slug": "2026-11-13-D039"}, {"f": "D040-1.mp3", "id": "D040", "part": "1", "t": "1과목 총정리① — 요구사항·UML·애자일·UI·모듈·패턴·미들웨어를 기출 함정으로 한 번 더 꿰기", "slug": "2026-11-14-D040"}, {"f": "D040-2.mp3", "id": "D040", "part": "2", "t": "1과목 총정리① — 요구사항·UML·애자일·UI·모듈·패턴·미들웨어를 기출 함정으로 한 번 더 꿰기", "slug": "2026-11-14-D040"}]</script>




<footer>2027년 정기 기사 1회 정보처리기사 필기 준비 · 공식 범위: Q-Net 2027~2029 출제기준</footer>
<script>
const L=JSON.parse(document.getElementById('pl-data').textContent),A=new Audio(),$=id=>document.getElementById(id),rates=[1,1.25,1.5,1.75,2];
A.preload='metadata';let cur=-1;
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const key=i=>'pos:../assets/audio/'+L[i].f;
function list(){$('pl-list').innerHTML=L.map((x,i)=>{const p=+localStorage[key(i)]||0,done=localStorage['done:'+x.f];
  return `<li class="${i==cur?'on':''}" data-i="${i}"><b>${x.id}${x.part?' '+x.part+'부':''}</b> ${x.t}<span class="d">${done?'✔ 다 들음':p>5?'이어 듣기 '+fmt(p):''}</span></li>`}).join('');
  $('pl-list').querySelectorAll('li').forEach(li=>li.onclick=()=>load(+li.dataset.i,true))}
function load(i,play){if(i<0||i>=L.length)return;cur=i;const x=L[i];A.src='assets/audio/'+x.f;A.playbackRate=+localStorage.rate||1;
  $('pl-now').textContent=x.id+(x.part?' '+x.part+'부':'')+' · '+x.t;$('pl-page').href='days/'+x.slug+'.html';localStorage.plLast=x.f;
  A.addEventListener('loadedmetadata',()=>{const p=+localStorage[key(i)];if(p>5&&p<A.duration-5)A.currentTime=p;A.playbackRate=+localStorage.rate||1},{once:true});
  if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:$('pl-now').textContent,artist:'정처기 듣는 강의',artwork:[{src:'assets/favicon/apple-touch-icon.png',sizes:'180x180',type:'image/png'}]})}
  if(play)A.play();list()}
A.ontimeupdate=()=>{if(cur<0)return;localStorage[key(cur)]=A.currentTime|0;$('pl-bar').max=A.duration||1;$('pl-bar').value=A.currentTime;$('pl-time').textContent=fmt(A.currentTime)+' / '+fmt(A.duration)};
A.onended=()=>{localStorage['done:'+L[cur].f]=1;localStorage[key(cur)]=0;if($('pl-auto').checked&&cur+1<L.length)load(cur+1,true);else list()};
A.onplay=A.onpause=()=>{$('pl-play').textContent=A.paused?'▶ 재생':'⏸ 일시정지'};
$('pl-bar').oninput=e=>A.currentTime=+e.target.value;
$('pl-play').onclick=()=>{if(cur<0)load(0,true);else A.paused?A.play():A.pause()};
$('pl-prev').onclick=()=>load(cur-1,true);$('pl-next').onclick=()=>load(cur+1,true);
$('pl-b30').onclick=()=>A.currentTime-=30;$('pl-b10').onclick=()=>A.currentTime-=10;$('pl-f10').onclick=()=>A.currentTime+=10;$('pl-f30').onclick=()=>A.currentTime+=30;
const rb=$('pl-rate');rb.textContent='속도 '+(+localStorage.rate||1)+'×';rb.onclick=()=>{const r=rates[(rates.indexOf(A.playbackRate)+1)%rates.length];A.playbackRate=r;localStorage.rate=r;rb.textContent='속도 '+r+'×'};
$('pl-auto').checked=localStorage.plAuto!=='0';$('pl-auto').onchange=e=>localStorage.plAuto=e.target.checked?1:0;
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>A.play());m.setActionHandler('pause',()=>A.pause());
  m.setActionHandler('previoustrack',()=>load(cur-1,true));m.setActionHandler('nexttrack',()=>load(cur+1,true));
  m.setActionHandler('seekbackward',()=>A.currentTime-=10);m.setActionHandler('seekforward',()=>A.currentTime+=10)}
document.addEventListener('keydown',e=>{if(e.key===' '&&e.target===document.body){e.preventDefault();$('pl-play').click()}});
const last=L.findIndex(x=>x.f===localStorage.plLast);load(last>=0?last:L.length-1,false);
</script></main></body></html>
